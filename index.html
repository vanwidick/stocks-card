<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1016"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json"><title>STOCKS Card</title>
<style>
*{box-sizing:border-box;margin:0}html,body{background:#0e1016;color:#ebebf0;font-family:system-ui,-apple-system,"DejaVu Sans",sans-serif;text-align:center}
body{max-width:480px;margin:0 auto;padding:12px 10px 24px;font-size:4vw}
@media(min-width:480px){body{font-size:19px}}
.tiers{display:flex;gap:10px}.tiers div{flex:1;padding:.6em 0;border-radius:10px;background:#22252e;color:#5f646e;font-weight:700;font-size:.9em}
.tiers .on{background:#2878eb;color:#ebebf0}
.g{color:#969ba5}.b{font-weight:700}.gold{color:#f0be3c}
#lbl{margin-top:1em;font-size:.85em}#ex{color:#c85a5a;font-size:.65em;min-height:1em}
#score{font-size:5.4em;line-height:1.1}#tk{font-size:2.3em;margin-top:.3em}
#price{font-size:1.5em;margin-top:.5em}#sh{font-size:1.8em;margin:.4em 0 .5em}.sm{font-size:.75em;margin-top:.4em}.xs{font-size:.6em;margin-top:.3em}
.btns{display:flex;gap:7%;margin:1.3em 2% 0}.btns button{flex:1;height:4.2em;border:0;border-radius:18px;color:#fff;font-size:2.1em;font-weight:700}
#skip{background:#d22d2d}#buy{background:#1eaa46}button:active{filter:brightness(1.3)}
.ban{background:#143c8c;border:3px solid #5aaaff;border-radius:14px;font-weight:700;margin:.8em auto 0}
#rec{width:86%;padding:.5em;font-size:1.35em}#vol{width:72%;padding:.4em;font-size:1.1em}#mom{width:86%;padding:.35em;font-size:.75em}
#note{color:#5aaaff;font-weight:700;min-height:1.3em;margin-top:.8em}
#none{display:none;padding-top:40vh;font-size:1.4em}#hist{font-size:.7em;margin-top:1.2em;text-align:left;color:#969ba5}
</style></head><body>
<div id="card" style="display:none"><div class="tiers"><div id="t1">TIER 1</div><div id="t2">TIER 2</div><div id="t3">TIER 3</div></div>
<div id="lbl" class="g b">STOCKS · BUY CARD</div><div id="ex"></div>
<div id="score" class="gold b"></div><div class="g b xs">SCORE</div>
<div id="tk" class="b"></div><div id="co" class="g sm"></div>
<div id="price" class="b"></div><div class="g xs">per share</div>
<div id="sh" class="gold b"></div><div id="stop" class="sm"></div><div id="exp" class="sm"></div><div id="ver" class="xs"></div>
<div class="btns"><button id="skip">SKIP</button><button id="buy">BUY</button></div>
<div id="rec" class="ban">RECOMMEND BUY</div><div id="vol" class="ban"></div><div id="mom" class="ban"></div>
<div id="note"></div></div>
<div id="none"><div class="b">No card right now</div><div id="upd" class="g sm"></div><div id="stats" class="g xs" style="margin-top:1em"></div></div>
<div id="lastc" class="g xs" style="display:none"></div><div id="pos" class="xs" style="text-align:left;margin-top:1.2em"></div><div id="hist"></div>
<script>
const $=i=>document.getElementById(i);let cur=null,last="";
const ct=s=>new Date(s).toLocaleTimeString("en-US",{timeZone:"America/Chicago",hour:"numeric",minute:"2-digit"})+" CT";
const show=(i,v)=>$(i).style.display=v?"":"none";
function render(){const c=cur,live=c&&c.ticker&&(!c.expires||new Date(c.expires)>new Date());
show("card",live);show("none",!live);show("lastc",!live&&c&&c.ticker);if(c&&c.ticker)$("lastc").textContent="Last card: "+c.ticker+" · score "+c.score+" · "+c.shares+" sh @ $"+Number(c.price).toFixed(2)+" = $"+Number(c.total).toFixed(2)+" · "+(c.stop_text||"")+(c.volume?" · vol "+Number(c.volume).toFixed(1)+"x":"")+(c.momentum?" · "+c.momentum:"");if(c)$("upd").textContent="Last updated "+(c.updated?ct(c.updated):"—");if(!live)return;
[1,2,3].forEach(n=>$("t"+n).className=c.tier==n?"on":"");$("ex").textContent=c.example?"EXAMPLE DATA":"";
$("score").textContent=c.score;$("tk").textContent=c.ticker;$("co").textContent=c.company||"";
$("price").textContent="$"+Number(c.price).toFixed(2);$("sh").textContent=c.shares+" SHARES · $"+Number(c.total).toFixed(2);
$("stop").textContent=c.stop_text||"";$("exp").textContent=c.expires?"Card expires "+ct(c.expires):"";$("ver").textContent=c.version||"";
show("rec",c.recommend===true);show("vol",c.volume>=1.5);$("vol").textContent="VOLUME "+Number(c.volume).toFixed(1)+"X";
show("mom",!!c.momentum);$("mom").textContent=c.momentum||"";}
async function stats(){let st={};try{st=await (await fetch("status.json?t="+Date.now(),{cache:"no-store"})).json()}catch(e){}
const d=new Date().toLocaleDateString("en-US",{timeZone:"America/Chicago"}),t=H().filter(h=>new Date(h.time).toLocaleDateString("en-US",{timeZone:"America/Chicago"})==d);
const ls=t.filter(h=>h.choice=="SKIP").length,lb=t.filter(h=>h.choice=="BUY").length,lc=new Set(t.map(h=>h.card_id)).size;
$("stats").textContent="TODAY · Cards "+Math.max(st.cards_today||0,lc)+" · Skipped "+Math.max(st.skipped_today||0,ls)+" · Approved "+Math.max(st.approved_today||0,lb)+(st.example?" (example)":"");
const P=st.positions||[],f=n=>"$"+Number(n||0).toFixed(2);
$("pos").innerHTML=P.length?`<div class="b">POSITIONS ${P.length} · ${f(P.reduce((a,x)=>a+(x.value||0),0))}${st.example?" (example)":""}</div>`+P.map(x=>`${x.ticker} · ${x.shares} sh · cost ${f(x.cost)} · now ${f(x.value)}`).join("<br>"):"";}
async function poll(){stats();try{const r=await fetch("card.json?t="+Date.now(),{cache:"no-store"});const t=await r.text();if(t!==last){last=t;cur=JSON.parse(t);$("note").textContent="";render();}else render();}catch(e){}}
const H=()=>JSON.parse(localStorage.getItem("taps")||"[]");
function hist(){$("hist").innerHTML=H().slice(-8).reverse().map(h=>`${ct(h.time)} · ${h.choice} · ${h.ticker} (${h.card_id})`).join("<br>")}
function tap(ch){if(!cur)return;const h=H();h.push({card_id:cur.card_id,ticker:cur.ticker,choice:ch,time:new Date().toISOString()});
localStorage.setItem("taps",JSON.stringify(h.slice(-50)));$("note").textContent=ch+" logged on this phone only — confirm in STOCKS chat (no trade placed)";hist();}
$("buy").onclick=()=>tap("BUY");$("skip").onclick=()=>tap("SKIP");
hist();poll();setInterval(poll,20000);
</script></body></html>
